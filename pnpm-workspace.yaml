linkWorkspacePackages: true
saveWorkspaceProtocol: false
preferWorkspacePackages: true

allowBuilds:
  '@parcel/watcher': true
  classic-level: true
  core-js-pure: true
  unrs-resolver: true
minimumReleaseAgeExclude:
  - '@bluelovers/string-natural-compare@2.0.16'
  - '@lazy-array/util-unique@1.0.8'
  - '@types/lodash@4.17.26'
  - '@types/node@26.6.5'
  - array-hyper-unique@2.1.10
  - dotenv@18.0.7
  - sort-object-keys2@3.0.9
